name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
     - uses: actions/checkout@v6
     - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run test:static
      - run: npm run test:integration
      - run: npm run build
      - name: HTTP smoke
        run: |
          npm run dev -- --host 0.0.0.0 > /tmp/manuauto.log 2>&1 &
          for i in {1..30}; do curl -fsS http://localhost:3000/api/health && break; sleep 2; done
          npm run test:smoke
