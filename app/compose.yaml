services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: manuauto
      POSTGRES_USER: manuauto
      POSTGRES_PASSWORD: manuauto_local
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manuauto"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: manuauto
      MINIO_ROOT_PASSWORD: manuauto_local_storage
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command: ["until mc alias set local http://minio:9000 manuauto manuauto_local_storage; do sleep 2; done; mc mb --ignore-existing local/manuauto; mc anonymous set none local/manuauto"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  postgres_data:
  minio_data:
